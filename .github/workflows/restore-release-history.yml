name: Restore historical release packages
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-release-history
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify and restore original release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RESTORE_INPUT_SHA256: b02d74b2aa4905b0aa78e942a2d3642cf522c8af457023d788679555b76d86e8
        run: |
          command -v zstd
          python3 tools/restore_release_history.py
